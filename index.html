<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Life RPG</title>
<style>
:root{--bg:#08111f;--card:#111d30;--line:#263852;--text:#f7fbff;--muted:#9fb0c7;--green:#79e58d;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#254c46,#08111f 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
.app{max-width:900px;margin:auto;padding:16px 12px 80px}.top,.sectionhead,.profile,.row{display:flex;align-items:center;gap:10px}.top,.sectionhead{justify-content:space-between}.brand{font-size:24px;font-weight:900}.sub,.muted{color:var(--muted);font-size:12px}
button,input,select{font:inherit}button{cursor:pointer}.icon,.ghost{background:#ffffff0d;color:#fff;border:1px solid #ffffff15;border-radius:14px;padding:10px}.hero{margin-top:14px;padding:18px;border-radius:26px;background:linear-gradient(145deg,#182a42,#0e192a);border:1px solid #ffffff12;box-shadow:0 16px 45px #0005}.avatar{width:82px;height:82px;border-radius:25px;display:grid;place-items:center;background:#ffffff09;border:2px solid #79e58d88;font-size:50px}.name{font-size:22px;font-weight:900}.rank{color:var(--gold);font-weight:800;margin-top:4px}.barrow{display:grid;grid-template-columns:38px 1fr 65px;gap:8px;align-items:center;margin-top:12px;font-size:12px}.bar{height:10px;background:#ffffff12;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#79e58d,#48c86b);border-radius:20px}.energy .fill{background:linear-gradient(90deg,#ffd166,#ff9f1c)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{padding:10px;border-radius:15px;text-align:center;background:#ffffff08}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.tab{padding:11px 4px;border-radius:14px;background:#ffffff09;color:#cbd7e7;border:1px solid #ffffff10;font-weight:800}.tab.active{background:var(--green);color:#08111f}.task{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:19px;padding:13px;margin:9px 0}.task.done{opacity:.55}.check{width:32px;height:32px;border-radius:10px;border:2px solid #536781;background:transparent;color:#07101c;font-weight:900}.done .check{background:var(--green);border-color:var(--green)}.taskmain{flex:1}.tasktitle{font-weight:850}.taskmeta{font-size:11px;color:var(--muted);margin-top:5px}.xp{color:var(--gold);font-weight:900}.tag{padding:4px 7px;border-radius:8px;background:#6db7ff18;color:#9dceff}.btn{background:var(--green);color:#07101c;border:0;border-radius:13px;padding:10px 13px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:14px}.card h3{margin:0 0 7px}.big{font-size:27px;font-weight:900}.empty{text-align:center;padding:25px;color:var(--muted);background:#ffffff06;border-radius:18px}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:5}.overlay.show{display:flex}.modal{width:min(720px,100%);background:#0e1a2b;border-radius:27px 27px 0 0;padding:18px;max-height:90vh;overflow:auto}.form{display:grid;gap:9px}.field{width:100%;padding:12px;border-radius:13px;background:#0b1627;border:1px solid var(--line);color:#fff}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{padding:16px;border-radius:18px;background:#ffffff08;color:#fff;border:2px solid #ffffff10}.choice button.selected{border-color:var(--green);background:#79e58d18}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#07101c;padding:10px 15px;border-radius:13px;font-weight:800;display:none;z-index:20}.toast.show{display:block}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.brand{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="brand">⚔️ Life RPG</div><div class="sub">حوّل حياتك الحقيقية إلى رحلة تطور</div></div><button class="icon" onclick="openProfile()">⚙️</button></div>
<section class="hero">
<div class="profile"><div class="avatar" id="avatar">👩🏻</div><div><div class="name" id="name">مغامر جديد</div><div class="rank" id="rank">رتبة F • المستوى 1</div><div class="sub" id="title">ابدأ رحلتك اليوم</div></div></div>
<div class="barrow"><b>XP</b><div class="bar"><div class="fill" id="xpbar"></div></div><b id="xptext">0/100</b></div>
<div class="barrow energy"><b>⚡</b><div class="bar"><div class="fill" id="energybar"></div></div><b id="energytext">100/100</b></div>
<div class="stats"><div class="stat"><b id="coins">0</b><span>💰 عملات</span></div><div class="stat"><b id="streak">0</b><span>🔥 سلسلة</span></div><div class="stat"><b id="doneCount">0</b><span>✅ منجزة</span></div><div class="stat"><b id="skillCount">0</b><span>🧠 مهارات</span></div></div>
</section>
<div class="tabs"><button class="tab active" onclick="tab('tasks',this)">المهام</button><button class="tab" onclick="tab('skills',this)">المهارات</button><button class="tab" onclick="tab('shop',this)">المتجر</button><button class="tab" onclick="tab('log',this)">السجل</button></div>
<main id="content"></main>
</div>
<div class="overlay" id="profileModal"><div class="modal"><div class="sectionhead"><h2>👤 شخصيتك</h2><button class="ghost" onclick="closeM('profileModal')">إغلاق</button></div><div class="choice"><button id="female" onclick="gender('female')">👩🏻<br><b>بنت</b></button><button id="male" onclick="gender('male')">👨🏻<br><b>ولد</b></button></div><div class="form" style="margin-top:10px"><input class="field" id="nameInput" placeholder="اسم الشخصية"><select class="field" id="style"><option>مغامر</option><option>طالب</option><option>رياضي</option><option>كاجوال</option></select><button class="btn" onclick="saveProfile()">حفظ الشخصية</button></div></div></div>
<div class="overlay" id="addModal"><div class="modal"><div class="sectionhead"><h2>➕ مهمة واقعية</h2><button class="ghost" onclick="closeM('addModal')">إغلاق</button></div><div class="form"><input class="field" id="taskInput" placeholder="مثال: طبخ وجبة صحية"><select class="field" id="catInput"><option>تطوير ذاتي</option><option>تعلم</option><option>مال وادخار</option><option>طبخ ومنزل</option><option>علاقات</option><option>صحة</option><option>عمل ودراسة</option></select><select class="field" id="xpInput"><option value="10">10 XP • سهل</option><option value="20">20 XP • متوسط</option><option value="35">35 XP • مهم</option><option value="50">50 XP • تحدي</option></select><button class="btn" onclick="addTask()">إضافة</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const K="lifeRPG_v2",D={profile:{name:"مغامر جديد",gender:"female",style:"مغامر"},xp:0,level:1,coins:0,energy:100,streak:0,totalDone:0,skills:{"تعلم":0,"تطوير ذاتي":0,"مال وادخار":0,"طبخ ومنزل":0,"علاقات":0,"صحة":0},tasks:[{id:1,title:"ادخر مبلغًا صغيرًا اليوم",cat:"مال وادخار",xp:20,done:false},{id:2,title:"حضّر وجبة منزلية بنفسك",cat:"طبخ ومنزل",xp:20,done:false},{id:3,title:"تعلّم شيئًا مفيدًا لمدة 20 دقيقة",cat:"تعلم",xp:20,done:false},{id:4,title:"تواصل مع شخص مهم لك برسالة لطيفة",cat:"علاقات",xp:15,done:false},{id:5,title:"رتّب مساحة صغيرة من غرفتك",cat:"تطوير ذاتي",xp:10,done:false}],log:[],owned:[]};
let s={...D,...JSON.parse(localStorage.getItem(K)||"{}")}; s.profile={...D.profile,...(s.profile||{})}; s.skills={...D.skills,...(s.skills||{})};
const save=()=>localStorage.setItem(K,JSON.stringify(s));
function rank(){return s.level>=30?"S":s.level>=20?"A":s.level>=12?"B":s.level>=7?"C":s.level>=3?"D":"F"}
function render(){avatar.textContent=s.profile.gender==="female"?"👩🏻":"👨🏻";name.textContent=s.profile.name;rankEl.textContent=`رتبة ${rank()} • المستوى ${s.level}`;title.textContent=s.profile.style;let n=s.level*100;xpbar.style.width=Math.min(100,s.xp/n*100)+"%";xptext.textContent=`${s.xp}/${n}`;energybar.style.width=s.energy+"%";energytext.textContent=s.energy+"/100";coins.textContent=s.coins;streak.textContent=s.streak;doneCount.textContent=s.totalDone;skillCount.textContent=Object.values(s.skills).filter(v=>v>0).length;save()}
const rankEl=document.getElementById("rank");
function tab(t,el){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");({tasks:tasks,skills,shop,log})[t]()}
function tasks(){content.innerHTML=`<div class="sectionhead"><h2>🎯 مهام اليوم</h2><button class="btn" onclick="openM('addModal')">+ مهمة</button></div>${s.tasks.map(t=>`<div class="task ${t.done?"done":""}"><button class="check" onclick="done(${t.id})">${t.done?"✓":""}</button><div class="taskmain"><div class="tasktitle">${safe(t.title)}</div><div class="taskmeta"><span class="tag">${t.cat}</span> <span class="xp">+${t.xp} XP</span></div></div></div>`).join("")}<div class="grid"><div class="card"><h3>💡 نظام واقعي</h3><div class="muted">المهام مبنية على أفعال حقيقية: تعلم، ادخار، طبخ، علاقات، صحة وتنظيم.</div></div><div class="card"><h3>🔥 سلسلة</h3><div class="big">${s.streak}</div><div class="muted">استمر كل يوم.</div></div></div>`}
function skills(){content.innerHTML=`<div class="sectionhead"><h2>🧠 مهارات الحياة</h2></div><div class="grid">${Object.entries(s.skills).map(([k,v])=>`<div class="card"><h3>${k}</h3><div class="big">${v} XP</div><div class="bar"><div class="fill" style="width:${Math.min(100,v/300*100)}%"></div></div></div>`).join("")}</div>`}
function shop(){let a=[["☕","استراحة فاخرة",60],["🎧","وقت ترفيه",120],["🍕","وجبة تحبها",180],["🎮","جلسة لعب",250],["👕","ستايل جديد",350],["🏆","شارة أسطورية",500]];content.innerHTML=`<div class="sectionhead"><h2>🛒 المتجر</h2><span class="muted">${s.coins} 💰</span></div><div class="grid">${a.map((x,i)=>`<div class="card"><div style="font-size:34px">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[2]} 💰</div><button class="btn" style="margin-top:9px" onclick="buy(${i},${x[2]})">${s.owned.includes(i)?"تم الشراء":"شراء"}</button></div>`).join("")}</div>`}
function log(){content.innerHTML=`<div class="sectionhead"><h2>📅 السجل اليومي</h2><button class="ghost" onclick="newDay()">يوم جديد</button></div>${s.log.length?s.log.slice().reverse().map(x=>`<div class="task"><div>🏅</div><div class="taskmain"><div class="tasktitle">${safe(x.text)}</div><div class="taskmeta">${x.date} • +${x.xp} XP</div></div></div>`).join(""):`<div class="empty">أول إنجاز يبدأ هنا ✨</div>`}`}
function done(id){let t=s.tasks.find(x=>x.id===id);if(!t||t.done)return;t.done=true;s.xp+=t.xp;s.coins+=Math.max(5,Math.floor(t.xp/2));s.energy=Math.max(0,s.energy-5);s.skills[t.cat]=(s.skills[t.cat]||0)+t.xp;s.totalDone++;s.streak=Math.max(1,s.streak);s.log.push({text:t.title,xp:t.xp,date:new Date().toLocaleString("ar-SA")});while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;s.coins+=50}render();tasks();toast("إنجاز رائع! +" + t.xp + " XP 🎉")}
function addTask(){let title=taskInput.value.trim();if(!title)return;let xp=+xpInput.value;s.tasks.push({id:Date.now(),title,cat:catInput.value,xp,done:false});taskInput.value="";closeM("addModal");render();tasks();toast("تمت إضافة المهمة")}
function buy(i,c){if(s.owned.includes(i))return;if(s.coins<c){toast("تحتاج عملات أكثر 💰");return}s.coins-=c;s.owned.push(i);render();shop();toast("تم الشراء 🎁")}
function gender(g){s.profile.gender=g;female.classList.toggle("selected",g==="female");male.classList.toggle("selected",g==="male")}
function openProfile(){nameInput.value=s.profile.name;style.value=s.profile.style;gender(s.profile.gender);openM("profileModal")}
function saveProfile(){s.profile.name=nameInput.value.trim()||"مغامر";s.profile.style=style.value;render();closeM("profileModal");toast("تم حفظ الشخصية")}
function newDay(){s.tasks.forEach(t=>t.done=false);s.energy=100;save();tasks();toast("بدأ يوم جديد 🌅")}
function openM(id){document.getElementById(id).classList.add("show")}function closeM(id){document.getElementById(id).classList.remove("show")}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1700)}
function safe(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]))}
render();tasks();
</script>
</body></html>
